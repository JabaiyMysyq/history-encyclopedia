<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>History Bot | Interactive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        #chat-box { 
            border: 1px solid #ccc; 
            padding: 20px; 
            height: 200px; 
            margin-bottom: 10px; 
            background: #f9f9f9; 
            overflow-y: auto; /* Добавлена прокрутка для длинных диалогов */
        }
    </style>
</head>
<body>

<header>
    <nav>
        <div class="logo">HistoryWorld 🏛️</div>
        <div class="menu">
            <a href="index.html">Home</a>
            <a href="timeline.html">Timeline Agent</a>
            <a href="quiz.html" class="active">History Bot</a>
            <a href="creators.html">Creators</a> </div>
    </nav>
</header>

<main>
    <h2>Ask the History Bot</h2>
    <div id="chat-box">
        <p><strong>Bot:</strong> Hello! Ask me about the Great Wall of China or the Renaissance.</p>
    </div>
    <input type="text" id="userInput" placeholder="Type your question...">
    <button onclick="askBot()">Ask</button>

    <script>
        function askBot() {
            const box = document.getElementById('chat-box');
            const input = document.getElementById('userInput').value;
            if (input.trim() === "") return; // Защита от пустых сообщений

            box.innerHTML += `<p><strong>You:</strong> ${input}</p>`;
            box.innerHTML += `<p><strong>Bot:</strong> That is a great question! Based on my records, that event changed history significantly.</p>`;
            document.getElementById('userInput').value = "";
            box.scrollTop = box.scrollHeight; // Авто-прокрутка вниз при ответе
        }
    </script>
</main>

<footer>
    <div class="footer-content">
        <p><strong>Authors:</strong> Magzan Ayim & Aizere Berdaly</p>
        <p>© 2026 | ICT - Management | Narxoz University</p>
        <button id="backToTop" onclick="window.scrollTo(0, 0)">↑ Back to Top</button>
    </div>
</footer>

</body>
</html>
